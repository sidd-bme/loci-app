[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loci-modeling"
version = "0.1.0"
description = "Developer-side training and evaluation pipeline for rights-cleared Loci models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26,<2",
  "pillow>=10,<12",
  "scipy>=1.11,<2",
  "scikit-image>=0.22,<0.25",
  "tifffile>=2023.9.26",
  "torch>=2.1,<2.3",
]

[project.optional-dependencies]
export = [
  "onnx>=1.14,<2",
  "onnxruntime>=1.16,<2",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
loci-modeling = "loci_modeling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loci_modeling"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
