<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">What a local agent can do through Loci MCP</title>
  <desc id="description">A local agent connects to Loci MCP to inspect sources and allowed context, discover tools and recipe guidance, prepare and preview recipes, run and follow local jobs, inspect results, and export reviewed results. Optional experimental actions include viewing selected image regions, adjusting display settings, exploring allowed threshold and minimum-size ranges, creating a local vision handoff, and continuing a human-prepared classical remote run. A person chooses access and reviews results in the Loci desktop or human CLI. Every capability is visible in this static map.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 7 3.5 0 7Z" fill="#6a998c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #23443c; }
      .heading { font-size: 27px; font-weight: 600; letter-spacing: -.4px; }
      .detail { font-size: 20px; fill: #586f66; }
      .card { fill: #fffef9; stroke: #cbdcd1; stroke-width: 1.5; }
      .branch { fill: none; stroke: #9cbcaf; stroke-width: 2; }
      .tip { fill: none; stroke: #6a998c; stroke-width: 2; marker-end: url(#arrow); }
      .badge { fill: #e6eee0; }
      .badge-text { font-size: 16px; font-weight: 600; fill: #59734f; }
    </style>
  </defs>
  <rect width="1600" height="960" fill="#f5f3eb"/>
  <rect x="45" y="43" width="8" height="78" rx="4" fill="#2b8d7b"/>
  <text x="77" y="80" font-size="43" font-weight="650" letter-spacing="-1">What your agent can do in Loci</text>
  <text x="79" y="119" font-size="23" fill="#586f66">Connected through MCP, with you in control</text>

  <!-- The central connection branches to every action; nothing is hidden. -->
  <path d="M800 257V318" class="tip"/>
  <path d="M660 390H560V240M560 390V640" class="branch"/>
  <path d="M560 240H515" class="tip"/>
  <path d="M560 440H515" class="tip"/>
  <path d="M560 640H515" class="tip"/>
  <path d="M940 390H1040V240M1040 390V640" class="branch"/>
  <path d="M1040 240H1085" class="tip"/>
  <path d="M1040 440H1085" class="tip"/>
  <path d="M1040 640H1085" class="tip"/>
  <path d="M800 445V474" class="branch"/>
  <path d="M800 630V739H370V758" class="tip"/>
  <path d="M800 739H1230V758" class="tip"/>

  <rect x="660" y="175" width="280" height="78" rx="16" fill="#e3ede2"/>
  <text x="800" y="222" text-anchor="middle" font-size="27" font-weight="600">Your local agent</text>
  <rect x="660" y="335" width="280" height="110" rx="20" fill="#2f7969"/>
  <text x="800" y="379" text-anchor="middle" font-size="32" font-weight="600" fill="#fffef7" style="fill:#fffef7">Loci MCP</text>
  <text x="800" y="415" text-anchor="middle" font-size="20" style="fill:#e2efe5">Work with your study</text>

  <rect x="45" y="165" width="455" height="150" rx="18" class="card"/>
  <text x="74" y="207" class="heading">Inspect a source</text>
  <text x="74" y="247" class="detail">Read source details and allowed context.</text>
  <text x="74" y="277" class="detail">Discover tools and recipe guidance.</text>

  <rect x="45" y="365" width="455" height="150" rx="18" class="card"/>
  <text x="74" y="407" class="heading">Prepare &amp; preview</text>
  <text x="74" y="444" class="detail">Check a recipe, then preview its effect.</text>
  <text x="74" y="475" font-size="18" fill="#59734f" style="fill:#59734f">Optional: explore allowed threshold</text>
  <text x="74" y="498" font-size="18" style="fill:#59734f">and minimum-size ranges.</text>

  <rect x="45" y="565" width="455" height="150" rx="18" class="card"/>
  <text x="74" y="607" class="heading">Run &amp; follow jobs</text>
  <text x="74" y="647" class="detail">Start a local analysis.</text>
  <text x="74" y="677" class="detail">Check its progress or cancel it.</text>

  <rect x="1100" y="165" width="455" height="150" rx="18" class="card"/>
  <text x="1129" y="207" class="heading">See images &amp; adjust display</text>
  <text x="1129" y="247" class="detail">View selected image regions.</text>
  <text x="1129" y="277" class="detail">Read or change channel display settings.</text>
  <rect x="1438" y="289" width="91" height="27" rx="9" class="badge"/>
  <text x="1483" y="308" text-anchor="middle" class="badge-text">Optional</text>

  <rect x="1100" y="365" width="455" height="150" rx="18" class="card"/>
  <text x="1129" y="407" class="heading">Inspect results</text>
  <text x="1129" y="447" class="detail">Read measurements and methods.</text>
  <text x="1129" y="477" class="detail">View a result image.</text>

  <rect x="1100" y="565" width="455" height="150" rx="18" class="card"/>
  <text x="1129" y="607" class="heading">Export reviewed results</text>
  <text x="1129" y="647" class="detail">Save the version you reviewed.</text>
  <text x="1129" y="677" class="detail">Destination chosen by you.</text>

  <!-- One human-control note keeps review outside the agent's actions. -->
  <rect x="640" y="475" width="320" height="155" rx="18" fill="#ede9dc"/>
  <g transform="translate(659 499)" fill="none" stroke="#817b63" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="9" r="7"/>
    <path d="M0 35v-5c0-9 24-9 24 0v5"/>
  </g>
  <text x="701" y="520" font-size="21" font-weight="600">You choose access.</text>
  <text x="665" y="558" font-size="21" font-weight="600">You review results.</text>
  <text x="665" y="594" font-size="18" style="fill:#756f5a">In Loci or the human CLI</text>

  <rect x="45" y="770" width="650" height="140" rx="18" class="card"/>
  <text x="74" y="812" class="heading">Create a vision handoff</text>
  <rect x="578" y="788" width="91" height="27" rx="9" class="badge"/>
  <text x="623" y="807" text-anchor="middle" class="badge-text">Optional</text>
  <text x="74" y="851" class="detail">Package selected images and context for discussion.</text>
  <text x="74" y="880" class="detail">Saved locally; upload remains your choice.</text>

  <rect x="905" y="770" width="650" height="140" rx="18" class="card"/>
  <text x="934" y="812" class="heading">Continue a prepared remote run</text>
  <rect x="1438" y="788" width="91" height="27" rx="9" class="badge"/>
  <text x="1483" y="807" text-anchor="middle" class="badge-text">Optional</text>
  <text x="934" y="851" class="detail">Submit, follow, cancel, retrieve and attach outputs.</text>
  <text x="934" y="880" class="detail">Classical analysis, prepared by a person.</text>

  <text x="800" y="943" text-anchor="middle" font-size="18" style="fill:#718273">Optional features are experimental and enabled separately.</text>
</svg>
