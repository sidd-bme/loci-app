[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loci-engine"
version = "0.1.0"
description = "Local image analysis engine for Loci"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Loci contributors" }]
dependencies = [
  "h5py>=3.12,<4",
  "imagecodecs>=2024.9.22,<2027",
  "numpy>=2.1,<2.5",
  "opencv-python-headless>=4.10,<5.1",
  "pillow>=11,<13",
  "scipy>=1.14,<2",
  "scikit-image>=0.24,<1",
  "tifffile>=2024.9.20",
  "simpleitk>=2.5.5,<3",
  "openslide-python>=1.4.6,<2",
  "openslide-bin==4.0.1.2",
  "mcp>=2,<3",
  "zarr==3.1.6",
  "roifile==2026.2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
bundle = ["pyinstaller>=6.17,<7"]
cellpose = ["cellpose==4.2.1.1"]
onnx = [
    "onnx>=1.22,<2",
    "onnxruntime>=1.29,<2",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
loci-engine = "loci_engine.worker:main"
loci-research = "loci_engine.research_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loci_engine"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
